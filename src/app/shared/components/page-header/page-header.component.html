<div class="page-header" [class.page-header--flex]="flex()">
  <div class="page-header__content">
    <h1 class="page-title">{{ title() }}</h1>
    @if (subtitle()) {
      <span class="page-subtitle">{{ subtitle() }}</span>
    }
  </div>

  <div class="page-header__actions">
    <ng-content />
  </div>
</div>
