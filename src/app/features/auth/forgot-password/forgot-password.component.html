<div class="form-header">
  <h2>Забули пароль?</h2>
  <p>Введіть email, пов'язаний з вашим акаунтом</p>
</div>

<form [formGroup]="form" (ngSubmit)="submit()">
  @if (error()) {
    <div class="error-alert">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ error() }}</span>
    </div>
  }

  @if (success()) {
    <div class="success-alert">
      <i class="pi pi-check-circle"></i>
      <span>Лист з інструкціями відправлено на ваш email. Перевірте пошту (та папку Спам).</span>
    </div>
  }

  <div class="input-group">
    <label for="email">Email</label>
    <input
      pInputText
      id="email"
      type="email"
      formControlName="email"
      placeholder="name@example.com"
    />
  </div>

  <p-button
    type="submit"
    label="Відновити пароль"
    [loading]="loading()"
    [disabled]="form.invalid || success()"
    styleClass="auth-btn w-full mt-2"
  ></p-button>
</form>

<div class="form-footer">Згадали пароль? <a routerLink="/auth/login">Увійти</a></div>
