@if (!success()) {
  <div class="form-header">
    <h2>Забули пароль?</h2>
    <p>Введіть email, пов'язаний з вашим акаунтом</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) {
      <div class="error-alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <div class="input-group">
      <label for="email">Email</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        placeholder="name@example.com"
      />
    </div>

    <p-button
      type="submit"
      label="Відновити пароль"
      [loading]="loading()"
      [disabled]="form.invalid"
      styleClass="auth-btn w-full mt-2"
    ></p-button>
  </form>

  <div class="form-footer">Згадали пароль? <a routerLink="/auth/login">Увійти</a></div>
} @else {
  <div class="status-card">
    <div class="status-icon pending">
      <i class="pi pi-envelope"></i>
    </div>
    <h2>Перевірте пошту</h2>
    <p>
      Ми відправили посилання для відновлення паролю на <b>{{ form.value.email }}</b
      >. Перейдіть за ним, щоб створити новий пароль.
    </p>

    <p-button
      label="Повернутися до входу"
      routerLink="/auth/login"
      styleClass="w-full mt-4"
    ></p-button>
  </div>
}
